[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv-win", "release", "frontend"]

[tool.ruff.lint]
# Start with correctness errors. Formatting and broader modernization rules can be
# enabled incrementally without forcing an unrelated repository-wide rewrite.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
  "subtitler/media_tags.py",
  "subtitler/media_search.py",
  "subtitler/broll_retrieval.py",
  "subtitler/broll_verification.py",
  "subtitler/visual_analysis.py",
  "subtitler/visual_evidence_store.py",
  "subtitler/moment_selection.py",
  "subtitler/moment_export.py",
  "subtitler/moments_cli.py",
  "subtitler/api_costs.py",
  "subtitler/config.py",
  "subtitler/run_artifacts.py",
  "subtitler/run_context.py",
  "subtitler/subtitle_stage.py",
  "subtitler/transcription_stage.py",
  "subtitler/transcription_backend.py",
  "subtitler/workflow_policy.py",
  "subtitler/subtitle_workflow.py",
  "subtitler/transcript_workflow.py",
  "subtitler/timed_text.py",
  "subtitler/media_export.py",
  "subtitler/broll_stage.py",
  "subtitler/artifact_io.py",
  "subtitler/media_identity.py",
  "subtitler/transcript_document.py",
  "subtitler/review_exchange.py",
  "subtitler/silence_review.py",
  "subtitler/operation_store.py",
  "subtitler/broll_session.py",
  "subtitler/broll_review.py",
  "subtitler/source_inspection.py",
  "subtitler/speech_editing.py",
  "subtitler/evidence.py",
  "subtitler/subtitle_checkpoint.py",
  "subtitler/speech_gaps.py",
  "subtitler/editorial_operations.py",
  "subtitler/editorial_runner.py",
  "subtitler/adaptive_cutting.py",
  "subtitler/editorial_structure.py",
  "subtitler/semantic_utterances.py",
  "subtitler/editorial_audio.py",
  "subtitler/hosted_inspection.py",
  "subtitler/frame_motion.py",
]
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["aviutl_subtitle", "subtitler"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "coverage-html"

[tool.coverage.xml]
output = "coverage.xml"
